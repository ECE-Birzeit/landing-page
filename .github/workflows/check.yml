name: Check the build

# Every push to dev, and every pull request, must still build. Nothing is deployed:
# birzeit.me only changes when main does (deploy.yml).
on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the home page's contributors come from GitHub
