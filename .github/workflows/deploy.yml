name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily, so the impact strip's counts follow the lab sites
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Stamp last-updated date
        # The footer date and sitemap lastmod come from the latest commit.
        run: |
          d=$(git log -1 --format=%cs)
          sed -i -E "s|(<time id=\"updated\" datetime=\")[^\"]*(\">)[^<]*|\1$d\2$d|" index.html
          sed -i -E "s|<lastmod>[^<]*</lastmod>|<lastmod>$d</lastmod>|" sitemap.xml
          mkdir _site
          cp index.html CNAME og.png favicon.svg favicon.png favicon.ico apple-touch-icon.png sitemap.xml robots.txt _site/
          cp -r v1 v2 legacy assets schedules stats _site/
      - name: Sign in to Google Analytics
        # Keyless: GitHub's OIDC token is exchanged for the ga-reader service account
        # (project birzeit-me-stats). Skipped until the GA_PROPERTY_ID variable is set.
        if: vars.GA_PROPERTY_ID != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/697216577318/locations/global/workloadIdentityPools/github/providers/landing-page
          service_account: ga-reader@birzeit-me-stats.iam.gserviceaccount.com
      - name: Count what's on the platform
        # Manuals, experiments and code listings from the four lab repos, plus visitors from Analytics
        run: |
          if [ -n "$GA_PROPERTY_ID" ]; then pip install --quiet google-auth requests; fi
          python3 scripts/stats.py > _site/stats.json
          cat _site/stats.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
          # Visitors count from the semester's first teaching day, read from bzu-course-catalog
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
