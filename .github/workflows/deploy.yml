name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily, so the impact strip's counts follow the lab sites
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the site with Astro
        # Pages come from src/, static files from public/; everything lands in dist/.
        # The footer date is read from the latest commit at build time.
        run: |
          npm ci
          npm run build
      - name: Stamp the sitemap
        run: |
          d=$(git log -1 --format=%cs)
          sed -i -E "s|<lastmod>[^<]*</lastmod>|<lastmod>$d</lastmod>|" dist/sitemap.xml
      - name: Sign in to Google Analytics
        # Keyless: GitHub's OIDC token is exchanged for the ga-reader service account
        # (project birzeit-me-stats). Skipped until the GA_PROPERTY_ID variable is set.
        if: vars.GA_PROPERTY_ID != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/697216577318/locations/global/workloadIdentityPools/github/providers/landing-page
          service_account: ga-reader@birzeit-me-stats.iam.gserviceaccount.com
      - name: Count what's on the platform
        # Manuals, experiments and code listings from the four lab repos, plus visitors from Analytics
        run: |
          if [ -n "$GA_PROPERTY_ID" ]; then pip install --quiet google-auth requests; fi
          python3 scripts/stats.py > dist/stats.json
          cat dist/stats.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
          # Visitors count from the semester's first teaching day, read from bzu-course-catalog
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
