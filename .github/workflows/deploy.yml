name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Stamp last-updated date
        # The footer date and sitemap lastmod come from the latest commit.
        run: |
          d=$(git log -1 --format=%cs)
          sed -i -E "s|(<time id=\"updated\" datetime=\")[^\"]*(\">)[^<]*|\1$d\2$d|" index.html
          sed -i -E "s|<lastmod>[^<]*</lastmod>|<lastmod>$d</lastmod>|" sitemap.xml
          mkdir _site
          cp index.html CNAME og.png favicon.png apple-touch-icon.png sitemap.xml robots.txt _site/
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
