<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>@import url('https://api.fontshare.com/v2/css?f[]=switzer@1&amp;display=swap');</style>
  </defs>
  <!-- Link preview for birzeit.me, in the site's light theme: warm paper, ink, one green accent.
       Render at 1200 x 630 in a browser engine to make og.png -->
  <rect width="1200" height="630" fill="#f3f2ec"/>
  <g font-family="Switzer, sans-serif">
