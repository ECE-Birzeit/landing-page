    <text font-size="80" font-weight="500" fill="#1a1b19" letter-spacing="-2.8">
      <tspan x="60" y="236">Lab manuals</tspan>
      <tspan x="60" y="322">and schedules</tspan>
      <tspan x="60" y="408">for Birzeit ECE</tspan>
