    </g>

    <rect x="772" y="160" width="364" height="412" rx="20" fill="#fbfaf6" stroke="#dddbd2" stroke-width="1.5"/>
    <text x="804" y="208" font-size="20" font-weight="500" fill="#45463f">This semester, from Ritaj</text>
    <line x1="804" y1="232" x2="1104" y2="232" stroke="#dddbd2" stroke-width="1.5"/>
