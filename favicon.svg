<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The ECE Labs prompt with no tile, so Safari has no dark square to ring. The cursor follows the
       browser's theme: ink on light tab bars, paper on dark ones. -->
  <style>
    .p { stroke: #16a34a } .c { fill: #1a1b19 }
    @media (prefers-color-scheme: dark) { .p { stroke: #4ade80 } .c { fill: #e8e6e1 } }
  </style>
  <path class="p" d="M14 17 L29 32 L14 47" fill="none" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="c" x="33" y="41" width="19" height="7.5" rx="3.75"/>
</svg>
